baseURL = "https://example.github.io/starry/"
title = "Starry"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
layoutDir = "layouts"
assetsDir = "assets"
publishDir = "public"
disableKinds = ["section", "taxonomy", "term", "RSS"]
ignoreFiles = ["syntax/.*"]
ignoreLogs = ["warning-home-page-is-leaf-bundle"]
disableHugoGeneratorInject = true

[languages.en]
locale = "en"
label = "English"
contentDir = "../docs/en"
weight = 1

[languages.zh-cn]
locale = "zh-CN"
label = "简体中文"
contentDir = "../docs/zh-cn"
weight = 2

[markup.highlight]
noClasses = false
lineNos = false

[module]
[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "../docs/syntax"
target = "assets/syntax"